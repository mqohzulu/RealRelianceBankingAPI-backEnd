name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
      - name: Restore
        run: dotnet restore RealRelianceBankingAPI/RealRelianceBankingAPI.sln
      - name: Build
        run: dotnet build RealRelianceBankingAPI/RealRelianceBankingAPI.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test RealRelianceBankingAPI/RealRelianceBankingAPI.sln --configuration Release --no-build
