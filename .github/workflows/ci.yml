name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.fsproj
            **/*.vbproj
            **/packages.lock.json
      - name: Restore
        run: dotnet restore RealRelianceBankingAPI/RealRelianceBankingAPI.sln
      - name: Build
        run: dotnet build RealRelianceBankingAPI/RealRelianceBankingAPI.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test RealRelianceBankingAPI/RealRelianceBankingAPI.sln --configuration Release --no-build
